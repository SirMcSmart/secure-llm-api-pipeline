# Local run of the hardened service with the same runtime restrictions as the ECS task definition.
services:
  api:
    build: .
    image: docqa:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env          # created by `make keys`; holds only DOCQA_API_KEY_HASHES for the server
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    pids_limit: 128
    mem_limit: 512m
