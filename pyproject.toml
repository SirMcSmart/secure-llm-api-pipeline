[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "1.0.0"
description = "Secure SDLC reference project: a document Q&A (RAG) API with per-user access control, hardened against the OWASP Top 10 for LLM Applications"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "baseline: proves a planted flaw is exploitable in vulnerable/ (expected to succeed)",
  "injection: prompt-injection / jailbreak regression suite",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv-tools"]
