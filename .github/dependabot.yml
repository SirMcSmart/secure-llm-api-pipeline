version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # vulnerable/ is the intentionally outdated "before" baseline; keep its pins as they are.
    exclude-paths:
      - "vulnerable/**"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    exclude-paths:
      - "vulnerable/**"
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
